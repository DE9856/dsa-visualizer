<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>Not found &middot; DSA Visualizer</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!--
      Everything here is inlined on purpose. This page is served when the host
      cannot find a path, which is exactly the situation in which a stylesheet
      at a hashed build path may also be missing — a 404 that depends on the
      bundle it is apologising for is a 404 that renders as unstyled text. The
      handful of tokens below are copied from `:root` in `src/index.css` rather
      than shared with it, and are the only duplicated colours in the project.
    -->
    <style>
      /* Self-hosted, like the app's — so this page contacts nothing either.
         One variable file per family covers the whole weight range. */
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }

      @font-face {
        font-family: "IBM Plex Sans";
        src: url("/fonts/ibm-plex-sans-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }

      :root {
        --bg: #0b0d12;
        --text: #edebe6;
        --text-dim: #8b90a0;
        --border: rgb(255 255 255 / 0.08);
        --panel: rgb(255 255 255 / 0.035);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
      }

      /* The app writes `data-theme` onto <html>; the script at the end of the
         body replays the reader's stored choice so this page doesn't flip to
         dark under someone who picked light. Without it, the OS decides. */
      :root[data-theme="light"] {
        --bg: #f2f3f6;
        --text: #14171d;
        --text-dim: #596070;
        --border: rgb(0 0 0 / 0.12);
        --panel: rgb(0 0 0 / 0.045);
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg: #f2f3f6;
          --text: #14171d;
          --text-dim: #596070;
          --border: rgb(0 0 0 / 0.12);
          --panel: rgb(0 0 0 / 0.045);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 48px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--sans);
        color: var(--text);
        background:
          radial-gradient(circle at 15% -10%, rgb(255 138 61 / 0.1), transparent 45%),
          radial-gradient(circle at 85% 0%, rgb(79 184 224 / 0.08), transparent 40%),
          var(--bg);
      }

      .mark {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        margin-bottom: 40px;
      }

      .code {
        font-family: var(--mono);
        font-size: clamp(64px, 14vw, 104px);
        font-weight: 700;
        line-height: 1;
        opacity: 0.13;
      }

      h1 {
        font-family: var(--mono);
        font-size: clamp(15px, 3.4vw, 19px);
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 2px 0 14px;
      }

      p {
        max-width: 460px;
        font-size: 13px;
        line-height: 1.65;
        color: var(--text-dim);
        margin: 0 0 26px;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-decoration: none;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 16px;
        transition: border-color 0.15s ease;
      }

      a:hover,
      a:focus-visible {
        border-color: rgb(255 138 61);
      }
    </style>
  </head>
  <body>
    <div class="mark">DSA://VISUALIZER</div>
    <div class="code">404</div>
    <h1>NOTHING TO VISUALIZE HERE</h1>
    <p>
      There is no page at this address. The visualizer is a single page &mdash; every topic lives at the
      root, so anything deeper than that was never here to find.
    </p>
    <a href="/">&larr; GO TO THE VISUALIZER</a>

    <script>
      // Replay the appearance the reader chose in the app. Same storage key and
      // same attribute as `useTheme`, so a light-theme reader doesn't get a
      // dark 404. Wrapped because storage throws outright in some privacy
      // modes, and an unstyled page is a worse failure than the wrong theme.
      try {
        var saved = JSON.parse(localStorage.getItem("dsa-viz:appearance") || "{}");
        var theme = saved.theme;
        if (theme === "system" || !theme) {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]').content =
            theme === "light" ? "#f2f3f6" : "#0b0d12";
        }
      } catch (e) {}
    </script>
  </body>
</html>
